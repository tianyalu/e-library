# Fallback profile: zero external dependencies (no MySQL, no Redis).
# Run with: -Dspring-boot.run.profiles=h2
spring:
  datasource:
    url: jdbc:h2:mem:elibrary;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    hikari:
      pool-name: elibrary-h2
      maximum-pool-size: 10
      auto-commit: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: false
  cache:
    type: simple

management:
  health:
    redis:
      enabled: false
